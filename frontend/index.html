<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SlopeGuard" />
    <title>SlopeGuard — Landslide Early Warning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("[SlopeGuard SW] Registered:", registration.scope);
              // Check for updates periodically
              setInterval(() => registration.update(), 60 * 60 * 1000);
            })
            .catch((error) => {
              console.log("[SlopeGuard SW] Registration failed:", error);
            });
        });
      }

      // Online/Offline status indicator
      function updateOnlineStatus() {
        document.body.classList.toggle("online", navigator.onLine);
        document.body.classList.toggle("offline", !navigator.onLine);
      }
      window.addEventListener("online", updateOnlineStatus);
      window.addEventListener("offline", updateOnlineStatus);
      updateOnlineStatus();
    </script>
  </body>
</html>
