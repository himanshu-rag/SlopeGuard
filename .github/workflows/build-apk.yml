name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor to Android
        working-directory: ./frontend
        run: npx cap copy

      - name: Set up Android SDK
        run: |
          # GitHub ubuntu-24.04 runners have Android SDK pre-installed at $ANDROID_HOME
          # If not set, install command-line tools manually
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not set, installing SDK command-line tools..."
            mkdir -p $HOME/android-sdk
            cd $HOME/android-sdk
            curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mkdir -p cmdline-tools && mv cmdline-tools latest && mv latest cmdline-tools/
            export ANDROID_HOME=$HOME/android-sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > ./frontend/android/local.properties

      - name: Make gradlew executable
        run: chmod +x ./frontend/android/gradlew

      - name: Ensure capacitor-cordova-android-plugins exists
        run: |
          # capacitor-cordova-android-plugins is gitignored and missing in fresh CI checkouts
          if [ ! -d "./frontend/android/capacitor-cordova-android-plugins" ]; then
            echo "Creating stub capacitor-cordova-android-plugins directory..."
            mkdir -p ./frontend/android/capacitor-cordova-android-plugins/src/main/libs
            echo "apply plugin: 'com.android.library'" > ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "android {" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    compileSdk = rootProject.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    defaultConfig {" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "        targetSdkVersion rootProject.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "        versionCode 1" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "        versionName \"1.0\"" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    }" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    compileOptions {" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "        sourceCompatibility JavaVersion.VERSION_21" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "        targetCompatibility JavaVersion.VERSION_21" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    }" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "}" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "repositories {" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    google()" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    mavenCentral()" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "}" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "dependencies {" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "    implementation \"androidx.appcompat:appcompat:1.7.1\"" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "}" >> ./frontend/android/capacitor-cordova-android-plugins/build.gradle
            echo "ext { cdvPluginPostBuildExtras = [] }" > ./frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi

      - name: Build Android APK
        working-directory: ./frontend/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-log.txt || {
            echo "=== BUILD FAILED - ERROR OUTPUT ==="
            tail -80 build-log.txt
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ./frontend/android/build-log.txt
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: slopeguard-android-apk
          path: ./frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: SlopeGuard Android APK
          tag_name: v${{ github.run_number }}
          files: ./frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
